<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0b0d10;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.card {
  width: 100%;
  max-width: 520px;
  background: #171a1f;
  border: 1px solid #30343b;
  border-radius: 18px;
  padding: 32px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.logo {
  width: 58px;
  height: 58px;
  border-radius: 14px;
  background: #ffffff;
  color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 20px;
  margin: 0 auto 20px;
}

h1 {
  text-align: center;
  margin: 0 0 10px;
  font-size: 28px;
}

.subtitle {
  text-align: center;
  color: #a8adb7;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #3a3f48;
  background: #0f1115;
  color: white;
  font-size: 15px;
  outline: none;
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: white;
  color: #111;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

.secondary {
  background: #292e36;
  color: white;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.auth-box {
  text-align: center;
}

.auth-title {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 10px;
}

.auth-text {
  color: #a8adb7;
  line-height: 1.5;
  margin-bottom: 22px;
}

.url-box {
  background: #0d0f13;
  border: 1px solid #30343b;
  border-radius: 10px;
  padding: 14px;
  word-break: break-all;
  text-align: left;
  color: #ddd;
  margin: 18px 0;
}

.success {
  text-align: center;
}

.success-icon {
  font-size: 45px;
  margin-bottom: 15px;
}

.small {
  color: #8f96a3;
  font-size: 13px;
  margin-top: 18px;
  text-align: center;
}
</style>
</head>

<body>

<div class="card">

  <!-- SCREEN 1 -->
  <div id="generator" class="screen active">
    <div class="logo">R</div>

    <h1>Domain Generator</h1>

    <p class="subtitle">
      Enter a URL to continue.
    </p>

    <input
      id="urlInput"
      type="url"
      placeholder="https://example.com"
      autocomplete="off"
    >

    <button onclick="continueToAuthorization()">
      Continue
    </button>

    <p class="small">
      Enter a website URL you want to use.
    </p>
  </div>


  <!-- SCREEN 2 -->
  <div id="authorization" class="screen">

    <div class="logo">R</div>

    <div class="auth-box">

      <div class="auth-title">
        Authorization
      </div>

      <div class="auth-text">
        You are about to continue to the selected website.
      </div>

      <div class="url-box" id="authUrl"></div>

      <button onclick="authorize()">
        Authorize
      </button>

      <button class="secondary" onclick="goBack()">
        Back
      </button>

    </div>

  </div>


  <!-- SCREEN 3 -->
  <div id="result" class="screen">

    <div class="success">

      <div class="success-icon">✓</div>

      <h1>Authorized</h1>

      <p class="subtitle">
        The URL you selected is:
      </p>

      <div class="url-box" id="finalUrl"></div>

      <button onclick="openUrl()">
        Open URL
      </button>

      <button class="secondary" onclick="startAgain()">
        Start Again
      </button>

    </div>

  </div>

</div>


<script>
let selectedUrl = "";

function continueToAuthorization() {

  const input = document.getElementById("urlInput");
  const value = input.value.trim();

  if (!value) {
    alert("Please enter a URL.");
    return;
  }

  try {
    const url = new URL(value);

    if (url.protocol !== "http:" && url.protocol !== "https:") {
      throw new Error();
    }

    selectedUrl = url.href;

  } catch {
    alert("Please enter a valid http:// or https:// URL.");
    return;
  }

  document.getElementById("authUrl").textContent = selectedUrl;

  document.getElementById("generator").classList.remove("active");
  document.getElementById("authorization").classList.add("active");
}


function authorize() {

  document.getElementById("finalUrl").textContent = selectedUrl;

  document.getElementById("authorization").classList.remove("active");
  document.getElementById("result").classList.add("active");
}


function goBack() {

  document.getElementById("authorization").classList.remove("active");
  document.getElementById("generator").classList.add("active");
}


function startAgain() {

  selectedUrl = "";

  document.getElementById("urlInput").value = "";

  document.getElementById("result").classList.remove("active");
  document.getElementById("generator").classList.add("active");
}


function openUrl() {

  if (selectedUrl) {
    window.open(selectedUrl, "_blank", "noopener,noreferrer");
  }

}
</script>

</body>
</html>
