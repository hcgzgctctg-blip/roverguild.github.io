<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domain Generator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:#0f0f10;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:48px 20px}
.container{width:min(100%,900px);background:#171719;border-radius:22px;padding:34px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
h1{margin:0 0 10px;font-size:32px;text-align:center}.hint{text-align:center;color:#aaa;margin:0 0 28px}
.row{display:flex;gap:12px}input{flex:1;min-width:0;padding:15px 17px;border:1px solid #3a3a3f;border-radius:12px;background:#0d0d0f;color:#fff;outline:none;font-size:16px}
button{border:0;border-radius:12px;padding:15px 24px;background:#fff;color:#111;font-weight:700;cursor:pointer;font-size:16px}
.note{margin:14px 0 24px;color:#aaa;font-size:14px}.result{display:none;border-radius:18px;overflow:hidden;border:1px solid #303035;background:#0b0b0d}
.resultbar{padding:14px 16px;border-bottom:1px solid #303035}.resultbar a{color:#fff;word-break:break-all}
iframe{display:block;width:100%;height:520px;border:0;background:#fff}.error{color:#ff8f8f;display:none;margin-top:12px}
@media(max-width:650px){.row{flex-direction:column}iframe{height:420px}.container{padding:24px}}
</style>
</head>
<body>
<main class="container">
<h1>Domain Generator</h1>
<p class="hint">Enter a URL to preview it in the panel below.</p>
<div class="row">
<input id="url" type="url" placeholder="https://example.github.io/" autocomplete="off">
<button id="continue">Continue</button>
</div>
<p class="note">Only use domains you own or have permission to embed. Some sites block iframes.</p>
<p id="error" class="error"></p>
<section id="result" class="result">
<div class="resultbar"><a id="shownUrl" target="_blank" rel="noopener noreferrer"></a></div>
<iframe id="preview" title="URL preview" referrerpolicy="no-referrer"></iframe>
</section>
</main>
<script>
const input=document.getElementById('url'),button=document.getElementById('continue'),result=document.getElementById('result'),preview=document.getElementById('preview'),shownUrl=document.getElementById('shownUrl'),error=document.getElementById('error');
button.addEventListener('click',()=>{
 error.style.display='none';
 const value=input.value.trim(); let url;
 try{url=new URL(value);if(!/^https?:$/.test(url.protocol))throw new Error()}catch(e){error.textContent='Please enter a valid http:// or https:// URL.';error.style.display='block';return}
 const generated=new URL(window.location.href); generated.searchParams.set('url',url.href);
 shownUrl.href=generated.href; shownUrl.textContent=generated.href; preview.src=url.href; result.style.display='block';
});
</script>
</body>
</html>
